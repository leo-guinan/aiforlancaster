{% extends "admin_dashboard.html" %}
{% block extra %}
<h2>Dining Events</h2>
<p class="subtitle">Create special events for Dining Club members.</p>
<form method="POST">
  <input type="text" name="title" placeholder="Event title" style="width:100%;padding:0.75rem;margin:0.5rem 0;background:#1a1a2e;border:2px solid #3d3d6b;color:#e8e8e8;font-family:VT323;">
  <input type="datetime-local" name="date" style="width:100%;padding:0.75rem;margin:0.5rem 0;background:#1a1a2e;border:2px solid #3d3d6b;color:#e8e8e8;font-family:VT323;">
  <button type="submit" class="buy-button">Create Event</button>
</form>
{% endblock %}
